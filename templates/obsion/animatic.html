<!doctype html>
<!-- animatic.html — grey-box animatic BEFORE any asset is generated (SKILL §1 / direction.md §3c, mandatory for pieces ≥ 20 s).
     Fill window.BEATS (one row per beat: time, duration, caption, boxes = rough shapes with simple moves, sfx events).
     It already has the living camera (camlife.js) and sound from the same events (sfx.js). Render a 3 fps sheet:
       node render.cjs animatic.html --fps 3 --w 1920 --h 1080 --out plan/animatic.mp4  → watch.py → give it to the critic.
     Make one copy per pitch (or let scripts/director.mjs do it). A copy outside scripts/ needs camlife.js, sfx.js, vendor/gsap.min.js beside it, or fix the three <script src> to ../scripts/… -->
<html><head><meta charset="utf-8"><title>animatic</title>
<style>html,body{margin:0;background:#1e1e1e}#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#d9d9d9;font:600 44px/1.15 system-ui,sans-serif}
.box{position:absolute;background:#9a9a9a;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#222;font-size:32px}
#cap{position:absolute;left:96px;bottom:84px;color:#111;background:#fff;padding:14px 22px;border-radius:10px;max-width:1500px}
#tc{position:absolute;right:96px;top:72px;color:#555;font:500 30px monospace}</style></head>
<body><div id="stage"><div id="world" style="position:absolute;inset:0"></div><div id="cap"></div><div id="tc"></div></div>
<script src="vendor/gsap.min.js"></script><script src="camlife.js"></script><script src="sfx.js"></script>
<script>
// ===== EDIT THIS: the beats of one pitch =====
window.BEATS = window.BEATS || [
  { t: 0, d: 3, cap: "Хук: герой-объект уже движется", boxes: [{ id: "hero", label: "герой", x: 760, y: 420, w: 400, h: 240, to: { x: 860 } }], sfx: [[0.1, "whoosh", { dur: 0.6 }]] },
  { t: 3, d: 4, cap: "Поворот: мир реагирует на героя", boxes: [{ id: "a", label: "реакция", x: 300, y: 300, w: 260, h: 200, to: { y: 340 } }, { id: "b", label: "бутафория", x: 1360, y: 560, w: 300, h: 180, to: { rot: 6 } }], sfx: [[3.2, "impact", { size: 0.8 }], [3.5, "paper", { dur: 0.4 }]] },
  { t: 7, d: 3, cap: "Финал: фирменный момент + семя окупается", boxes: [{ id: "end", label: "финал", x: 660, y: 360, w: 600, h: 360, to: { s: 1.08 } }], sfx: [[7.0, "riser", { dur: 1.2 }], [8.2, "pop"]] },
];
// ===== engine (no edits needed) =====
var DUR = BEATS.reduce((m, b) => Math.max(m, b.t + b.d), 0), tl = gsap.timeline({ paused: true }), W = document.getElementById("world"), EVENTS = [];
var cam = CAMLIFE.attach(W, { push: 0.03, period: 6 });
BEATS.forEach(function (b) {
  (b.boxes || []).forEach(function (o) {
    var el = document.createElement("div"); el.className = "box"; el.textContent = o.label || o.id; el.style.cssText += `;left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px;opacity:0`; W.appendChild(el);
    tl.set(el, { opacity: 1 }, b.t); tl.fromTo(el, { scale: 0.9 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, b.t);
    var to = o.to || {}; tl.to(el, { x: to.x != null ? to.x - o.x : 0, y: to.y != null ? to.y - o.y : 0, rotation: to.rot || 0, scale: to.s || 1, duration: Math.max(0.3, b.d - 0.4), ease: "power2.inOut" }, b.t + 0.3);
    tl.set(el, { opacity: 0 }, b.t + b.d);
  });
  tl.call(function () { document.getElementById("cap").textContent = b.cap; }, null, b.t);
  (b.sfx || []).forEach(function (e) { EVENTS.push(e); });
});
var CP = { _t: 0 }; Object.defineProperty(CP, "t", { get: function () { return this._t; }, set: function (v) { this._t = v; cam(v); document.getElementById("tc").textContent = v.toFixed(1) + " s"; var cur = BEATS.filter(function (b) { return v >= b.t; }).pop(); document.getElementById("cap").textContent = cur ? cur.cap : ""; } });
tl.to(CP, { t: DUR, duration: DUR, ease: "none" }, 0);
window.__duration = DUR; window.__seek = function (t) { tl.seek(t, false); return 0; };
window.__audioWav = async function () { return SFX.toWavBase64(await SFX.render(EVENTS, DUR, { bed: { bpm: 100, key: "A", mood: "warm", db: -12 } })); };
var q = /[?&]t=([\d.]+)/.exec(location.search); tl.seek(q ? +q[1] : 0); if (!q) tl.play();
</script></body></html>
